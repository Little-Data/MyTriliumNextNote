name: Trilium → Static Site

# 触发：把 document.db 提交到仓库的 trilium-data/ 目录即可自动重建
on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      root_note_id:
        description: '导出根笔记 ID（root = 整棵树；也可填某个子树 noteId 只发布该分支）'
        default: '1dMiMZa4sg4J'
      image:
        description: 'Trilium 服务端镜像，版本必须 >= 本地 Trilium 版本'
        default: 'triliumnext/trilium:v0.106.0'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

env:
  TRILIUM_PORT: '8080'
  OUT_DIR: public

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      trilium_image: ${{ steps.params.outputs.image }}
      root_note_id: ${{ steps.params.outputs.root_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: 解析输入参数
        id: params
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # GitHub 会把 default 值自动填入 inputs，所以这里一定有值
            echo "image=${{ inputs.image }}" >> "$GITHUB_OUTPUT"
            echo "root_id=${{ inputs.root_note_id }}" >> "$GITHUB_OUTPUT"
          else
            echo "image=triliumnext/trilium:v0.106.0" >> "$GITHUB_OUTPUT"
            echo "root_id=1dMiMZa4sg4J" >> "$GITHUB_OUTPUT"
          fi

      - name: 注入环境变量
        run: |
          echo "TRILIUM_IMAGE=${{ steps.params.outputs.image }}" >> "$GITHUB_ENV"
          echo "ROOT_NOTE_ID=${{ steps.params.outputs.root_id }}" >> "$GITHUB_ENV"

      - name: 调试确认
        run: |
          echo "→ TRILIUM_IMAGE=$TRILIUM_IMAGE"
          echo "→ ROOT_NOTE_ID=$ROOT_NOTE_ID"

      - name: 校验输入
        env:
          TRILIUM_PASSWORD: ${{ secrets.TRILIUM_PASSWORD }}
        run: |
          set -euo pipefail
          [ -f trilium-data/document.db ] || { echo "::error::缺少 trilium-data/document.db"; exit 1; }
          [ -n "$TRILIUM_PASSWORD" ] || { echo "::error::请配置 secrets.TRILIUM_PASSWORD"; exit 1; }
          ls -lh trilium-data/document.db
          echo "使用镜像: $TRILIUM_IMAGE"
          echo "导出根笔记: $ROOT_NOTE_ID"

      - name: 准备数据目录
        run: |
          set -euo pipefail
          DATA_DIR="$RUNNER_TEMP/trilium-data"
          mkdir -p "$DATA_DIR"
          cp trilium-data/document.db "$DATA_DIR/document.db"
          chmod -R 0777 "$DATA_DIR"
          echo "DATA_DIR=$DATA_DIR" >> "$GITHUB_ENV"

      - name: 启动 Trilium 服务端
        run: |
          set -euo pipefail
          docker run -d --name trilium \
            -p 8080:8080 \
            -e TRILIUM_DATA_DIR=/home/node/trilium-data \
            -e TRILIUM_PORT=8080 \
            -e TRILIUM_NETWORK_HOST=0.0.0.0 \
            -v "$DATA_DIR:/home/node/trilium-data" \
            "$TRILIUM_IMAGE"
          docker ps --filter name=trilium

      - name: 等待服务就绪 + ETAPI 登录
        env:
          TRILIUM_PASSWORD: ${{ secrets.TRILIUM_PASSWORD }}
        run: |
          set -euo pipefail
          url="http://127.0.0.1:${TRILIUM_PORT}"
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -m 3 -w '%{http_code}' "$url/" || true)
            [ "$code" != "000" ] && { echo "[ready] http $code after $((i*3))s"; break; }
            sleep 3
          done
          for i in $(seq 1 30); do
            body=$(jq -n --arg p "$TRILIUM_PASSWORD" '{password:$p}')
            code=$(curl -s -m 10 -X POST "$url/etapi/auth/login" \
                    -H 'Content-Type: application/json' \
                    -d "$body" -o /tmp/login.json -w '%{http_code}' || true)
            [ "$code" = "201" ] && { echo "[auth] ok"; break; }
            echo "[auth] $code, retry $i"; sleep 3
          done
          [ "$code" = "201" ] || { echo "::error::ETAPI 登录失败"; cat /tmp/login.json; exit 1; }
          token=$(jq -r .authToken /tmp/login.json)
          [ -n "$token" ] && [ "$token" != "null" ] || { echo "::error::未取到 authToken"; exit 1; }
          echo "::add-mask::$token"
          echo "TOKEN=$token" >> "$GITHUB_ENV"

      - name: 导出静态站点（format=share）
        run: |
          set -euo pipefail
          url="http://127.0.0.1:${TRILIUM_PORT}"
          echo "→ 导出笔记: $ROOT_NOTE_ID (image: $TRILIUM_IMAGE)"
          code=$(curl -sS -m 600 -X GET \
            "$url/etapi/notes/${ROOT_NOTE_ID}/export?format=share" \
            -H "Authorization: $TOKEN" \
            -o /tmp/site.zip -w '%{http_code}' || true)
          if [ "$code" != "200" ]; then
            echo "::error::导出失败，HTTP $code"
            head -c 800 /tmp/site.zip; echo
            exit 1
          fi
          head -c 2 /tmp/site.zip | grep -q 'PK' || { echo "::error::返回内容不是 zip"; head -c 800 /tmp/site.zip; exit 1; }
          ls -lh /tmp/site.zip
          mkdir -p "$OUT_DIR"
          unzip -q -o /tmp/site.zip -d "$OUT_DIR"
          touch "$OUT_DIR/.nojekyll"
          [ -d site-assets ] && cp -r site-assets/. "$OUT_DIR"/ || true
          test -f "$OUT_DIR/index.html" || { echo "::error::导出结果无 index.html"; find "$OUT_DIR" -maxdepth 2 | head -40; exit 1; }
          echo "生成页面数: $(find "$OUT_DIR" -name '*.html' | wc -l)"

      - name: 容器日志（排障用）
        if: always()
        run: |
          docker logs trilium 2>&1 | tail -60 || true
          docker rm -f trilium >/dev/null 2>&1 || true

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5